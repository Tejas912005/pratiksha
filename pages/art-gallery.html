<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art & Craft Gallery - Virtual India</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="nav-logo">
                <div class="nav-logo-icon">🏛️</div>
                <div class="nav-logo-text">Virtual<span>India</span></div>
            </a>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="regions.html" class="nav-link">Explore Regions</a></li>
                <li><a href="festivals.html" class="nav-link">Festivals</a></li>
                <li><a href="art-gallery.html" class="nav-link active">Art & Craft</a></li>
                <li><a href="quiz.html" class="nav-link">Quiz</a></li>
            </ul>

            <div class="nav-actions">
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="hi">हिं</button>
                </div>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>

            <button class="mobile-menu-btn">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="section" style="padding-top: 120px;">
        <div class="container">
            <h1 class="section-title" data-translate="gallery.title">Art & Craft Gallery</h1>
            <p class="section-subtitle" data-translate="gallery.subtitle">
                Explore India's rich artistic heritage through various art forms
            </p>

            <!-- Category Filter -->
            <div class="category-filter" id="categoryFilter">
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="dance">💃 Dance</button>
                <button class="category-btn" data-category="art">🎨 Art</button>
                <button class="category-btn" data-category="craft">🧵 Craft</button>
                <button class="category-btn" data-category="music">🎵 Music</button>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal for details -->
    <div id="detailModal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: var(--space-4);">
        <div
            style="background: var(--dark-card); border-radius: var(--radius-2xl); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative;">
            <button onclick="closeModal()"
                style="position: absolute; top: var(--space-4); right: var(--space-4); background: var(--dark-border); border: none; width: 40px; height: 40px; border-radius: var(--radius-full); color: white; cursor: pointer; font-size: 1.2rem;">×</button>
            <div id="modalContent" style="padding: var(--space-8);"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p class="footer-copyright">© 2024 Virtual India. All rights reserved.</p>
                <p class="footer-tagline">Made with ❤️ for Atmanirbhar Bharat</p>
            </div>
        </div>
    </footer>

    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let allItems = [];

        const categoryEmojis = {
            dance: '💃',
            art: '🎨',
            craft: '🧵',
            music: '🎵',
            cuisine: '🍛'
        };

        const categoryColors = {
            dance: 'linear-gradient(135deg, #FF6B6B 0%, #C44569 100%)',
            art: 'linear-gradient(135deg, #FF9933 0%, #E67E22 100%)',
            craft: 'linear-gradient(135deg, #138808 0%, #27AE60 100%)',
            music: 'linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%)',
            cuisine: 'linear-gradient(135deg, #800020 0%, #A52A2A 100%)'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('galleryGrid');
            const filterContainer = document.getElementById('categoryFilter');

            // Add filter listeners
            filterContainer.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterContainer.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterItems(btn.dataset.category);
                });
            });

            // Load items
            try {
                const response = await fetchCulturalItems();
                if (response.success && response.data) {
                    allItems = response.data;
                    renderItems(allItems);
                }
            } catch (error) {
                showError(grid, 'Failed to load gallery');
            }
        });

        function filterItems(category) {
            if (category === 'all') {
                renderItems(allItems);
            } else {
                renderItems(allItems.filter(item => item.category === category));
            }
        }

        function renderItems(items) {
            const grid = document.getElementById('galleryGrid');

            if (items.length === 0) {
                showEmpty(grid, '🎭', 'No items found', 'Try selecting a different category');
                return;
            }

            grid.innerHTML = items.map((item, index) => `
                <div class="gallery-item" onclick="showDetail(${index})" style="background: ${categoryColors[item.category] || 'var(--gradient-saffron)'};">
                    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 5rem; opacity: 0.3;">
                        ${categoryEmojis[item.category] || '🎭'}
                    </div>
                    <div class="gallery-item-overlay" style="opacity: 1;">
                        <span class="gallery-item-category">${formatCategory(item.category)}</span>
                        <h3 class="gallery-item-title">${item.name}</h3>
                        <p style="font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-2);">
                            ${item.region_name || ''}
                        </p>
                    </div>
                </div>
            `).join('');
        }

        function showDetail(index) {
            const item = allItems[index];
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div style="text-align: center; margin-bottom: var(--space-6);">
                    <div style="width: 100px; height: 100px; margin: 0 auto; background: ${categoryColors[item.category]}; border-radius: var(--radius-2xl); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
                        ${categoryEmojis[item.category] || '🎭'}
                    </div>
                </div>
                <span class="card-badge" style="display: block; text-align: center; margin-bottom: var(--space-4);">
                    ${formatCategory(item.category)}
                </span>
                <h2 style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-bold); text-align: center; margin-bottom: var(--space-4);">
                    ${item.name}
                </h2>
                <p style="color: var(--text-secondary); line-height: 1.7; text-align: center;">
                    ${item.description || 'No description available.'}
                </p>
                ${item.region_name ? `
                    <p style="text-align: center; margin-top: var(--space-4); color: var(--saffron);">
                        📍 ${item.region_name}
                    </p>
                ` : ''}
            `;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on backdrop click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });
    </script>
</body>

</html>
