<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Virtual India</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <!-- Navigation -->
    <nav class="navbar scrolled">
        <div class="container">
            <a href="../index.html" class="nav-logo">
                <div class="nav-logo-icon">🏛️</div>
                <div class="nav-logo-text">Virtual<span>India</span></div>
            </a>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="regions.html" class="nav-link">Explore Regions</a></li>
                <li><a href="festivals.html" class="nav-link">Festivals</a></li>
                <li><a href="art-gallery.html" class="nav-link">Art & Culture</a></li>
                <li><a href="quiz.html" class="nav-link">Quiz</a></li>
            </ul>

            <div class="nav-actions">
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="hi">हिं</button>
                </div>
            </div>

            <button class="mobile-menu-btn">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Search Hero -->
    <section class="search-hero">
        <div class="container">
            <h1 class="section-title" data-translate="search.title">Search</h1>

            <form class="search-form" id="searchForm">
                <div class="search-input-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search for art, festivals, regions..."
                        data-translate-placeholder="search.placeholder">
                    <button type="submit" class="btn btn-primary" data-translate="search.searchBtn">Search</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Search Results -->
    <section class="section" style="padding-top: 0;">
        <div class="container">
            <div id="searchResults"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p class="footer-copyright">© 2024 Virtual India. All rights reserved.</p>
                <p class="footer-tagline">Made with ❤️ for Atmanirbhar Bharat</p>
            </div>
        </div>
    </footer>

    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const categoryEmojis = {
            dance: '💃',
            art: '🎨',
            craft: '🧵',
            music: '🎵',
            cuisine: '🍛'
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (query) {
                document.getElementById('searchInput').value = query;
                performSearch(query);
            }
        });

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query.length >= 2) {
                history.pushState({}, '', `?q=${encodeURIComponent(query)}`);
                performSearch(query);
            }
        });

        async function performSearch(query) {
            const resultsContainer = document.getElementById('searchResults');
            showLoading(resultsContainer);

            try {
                const response = await search(query);

                if (response.success) {
                    renderResults(response.data, response.total, query);
                } else {
                    showError(resultsContainer, response.message);
                }
            } catch (error) {
                showError(resultsContainer, 'Search failed');
            }
        }

        function renderResults(data, total, query) {
            const container = document.getElementById('searchResults');

            if (total === 0) {
                showEmpty(container, '🔍', t('search.noResults'), `No results found for "${query}"`);
                return;
            }

            let html = `<h2 class="search-results-title">${total} ${t('search.results')} for "${query}"</h2>`;

            // Regions
            if (data.regions.length > 0) {
                html += `
                    <h3 style="font-size: var(--text-xl); margin: var(--space-8) 0 var(--space-4); color: var(--saffron);">🗺️ Regions</h3>
                    <div class="search-results-grid">
                        ${data.regions.map(r => `
                            <a href="region-detail.html?id=${r.id}" class="card">
                                <div class="card-content">
                                    <span class="card-badge">Region</span>
                                    <h3 class="card-title">${r.name}</h3>
                                    <p class="card-description">${r.description?.substring(0, 100)}...</p>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
            }

            // Cultural Items
            if (data.cultural_items.length > 0) {
                html += `
                    <h3 style="font-size: var(--text-xl); margin: var(--space-8) 0 var(--space-4); color: var(--saffron);">🎭 Cultural Items</h3>
                    <div class="search-results-grid">
                        ${data.cultural_items.map(item => `
                            <div class="card">
                                <div class="card-content">
                                    <span class="card-badge">${categoryEmojis[item.category] || ''} ${formatCategory(item.category)}</span>
                                    <h3 class="card-title">${item.name}</h3>
                                    <p class="card-description">${item.description?.substring(0, 100)}...</p>
                                    ${item.region_name ? `<p style="font-size: var(--text-sm); color: var(--saffron); margin-top: var(--space-2);">📍 ${item.region_name}</p>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Festivals
            if (data.festivals.length > 0) {
                html += `
                    <h3 style="font-size: var(--text-xl); margin: var(--space-8) 0 var(--space-4); color: var(--saffron);">🎉 Festivals</h3>
                    <div class="search-results-grid">
                        ${data.festivals.map(f => `
                            <div class="festival-card">
                                <span class="festival-month">${getMonthName(f.month)}</span>
                                <h3 class="festival-name">${f.name}</h3>
                                <p class="festival-description">${f.description?.substring(0, 100)}...</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = html;
        }
    </script>
</body>

</html>
