<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Regions - Virtual India</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="nav-logo">
                <div class="nav-logo-icon">🏛️</div>
                <div class="nav-logo-text">Virtual<span>India</span></div>
            </a>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="regions.html" class="nav-link active">Explore Regions</a></li>
                <li><a href="festivals.html" class="nav-link">Festivals</a></li>
                <li><a href="art-gallery.html" class="nav-link">Art & Culture</a></li>
                <li><a href="quiz.html" class="nav-link">Quiz</a></li>
            </ul>

            <div class="nav-actions">
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="hi">हिं</button>
                </div>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>

            <button class="mobile-menu-btn">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="section" style="padding-top: 120px;">
        <div class="container">
            <h1 class="section-title" data-translate="regions.title">Explore India's Regions</h1>
            <p class="section-subtitle" data-translate="regions.subtitle">
                Discover the unique cultural heritage of each region of India
            </p>

            <div class="regions-grid" id="regionsGrid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p class="footer-copyright">© 2024 Virtual India. All rights reserved.</p>
                <p class="footer-tagline">Made with ❤️ for Atmanirbhar Bharat</p>
            </div>
        </div>
    </footer>

    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const regionColors = {
            1: { gradient: "linear-gradient(135deg, rgba(255,153,51,0.3) 0%, rgba(230,126,34,0.4) 100%), url('https://images.unsplash.com/photo-1564507592333-c60657eea523?w=600&q=80') center/cover", class: 'region-north' },
            2: { gradient: "linear-gradient(135deg, rgba(19,136,8,0.3) 0%, rgba(39,174,96,0.4) 100%), url('https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?w=600&q=80') center/cover", class: 'region-south' },
            3: { gradient: "linear-gradient(135deg, rgba(65,105,225,0.3) 0%, rgba(107,141,214,0.4) 100%), url('https://images.unsplash.com/photo-1558431382-27e303142255?w=600&q=80') center/cover", class: 'region-east' },
            4: { gradient: "linear-gradient(135deg, rgba(128,0,32,0.3) 0%, rgba(165,42,42,0.4) 100%), url('https://images.unsplash.com/photo-1570168007204-dfb528c6958f?w=600&q=80') center/cover", class: 'region-west' }
        };

        // Fallback static data if API fails
        const fallbackRegions = [
            { id: 1, name: 'North India', states: 'Rajasthan, Punjab, Uttar Pradesh, Delhi, Himachal Pradesh' },
            { id: 2, name: 'South India', states: 'Tamil Nadu, Kerala, Karnataka, Andhra Pradesh, Telangana' },
            { id: 3, name: 'East India', states: 'West Bengal, Odisha, Bihar, Jharkhand, Assam' },
            { id: 4, name: 'West India', states: 'Maharashtra, Gujarat, Goa, Madhya Pradesh' }
        ];

        function renderRegions(regions) {
            const grid = document.getElementById('regionsGrid');
            grid.innerHTML = regions.map(region => `
                <a href="region-detail.html?id=${region.id}" class="region-card ${regionColors[region.id]?.class || ''}">
                    <div class="region-card-bg" style="background: ${regionColors[region.id]?.gradient || 'var(--gradient-saffron)'}"></div>
                    <div class="region-card-overlay"></div>
                    <div class="region-card-content">
                        <h3 class="region-card-title">${region.name}</h3>
                        <p class="region-card-states">${region.states?.split(',').slice(0, 3).join(', ')}...</p>
                        <span class="region-card-link">
                            Explore Region
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </span>
                    </div>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('regionsGrid');
            showLoading(grid);

            try {
                const response = await fetchRegions();
                if (response.success && response.data && response.data.length > 0) {
                    renderRegions(response.data);
                } else {
                    // Use fallback data
                    renderRegions(fallbackRegions);
                }
            } catch (error) {
                console.log('Using fallback data:', error);
                renderRegions(fallbackRegions);
            }
        });
    </script>
</body>

</html>
